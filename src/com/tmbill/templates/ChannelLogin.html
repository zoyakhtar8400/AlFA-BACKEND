<div class="channel-login-wrapper">
    <link rel="stylesheet" href="../css/Channel.css">
    <div class="bodymovin" id="channelImagediv">
        <img class="channelImage" src="../assets/images/dboy1.gif" alt="">
    </div>

    <div id="form-template">
        <form>
            <div class="row">
                <div class="col-sm-12">
                    <input data-i18n="[placeholder]tmChannelLogin.Username" id="channelUsername" name="username"
                        placeholder="Username" class="swal-content__input has-i18n" type="text">
                </div>
            </div>
            <div class="row">
                <div class="col-sm-12">
                    <input data-i18n="[placeholder]tmChannelLogin.Password" id="channelPassword" name="password"
                        placeholder="Password" class="swal-content__input has-i18n" type="password">
                </div>
            </div>
        </form>
    </div>
    <label data-i18n="tmChannelLogin.noteBothFiledarenecessary" id="warningLabelid" class="has-i18n" for="">Note: Both
        fields are necessary</label>
</div>
