<!-- ClosesShift.html -->

<div
  class="modal fade"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
  id="closeShiftModal">
  <link rel="stylesheet" href="../css/Account.css" />
  <link rel="stylesheet" href="../css/Closeshift.css" />

  <div class="modal-dialog modal-dialog-centered closeShiftmodal-dialog">
    <div
      class="modal-content startDayAndShiftModalwrapper closeShiftModalwrapper">
      <!-- Modal Header -->
      <div class="modal-header startDayAndShiftModalHeaderwrapper">
        <h5
          style="font-weight: bold"
          id="closeShiftModalHeaderId"
          class="has-i18n"
          data-i18n="controller:account.Closingshift">
          Closing Shift
        </h5>
      </div>

      <div
        class="modal-body startDayAndShiftModalbody"
        id="closeDayAndShiftModalbodyid">
        <div class="row closeDayAndShiftContainer">

          <div class="col-3 acc-layout-col">
            <div class="acc-card acc-card-full">
              <table id="closeShiftCashDenominationTableId" class="denom-table">
                <thead>
                  <tr>
                    <th
                      colspan="3"
                      class="currencyDenominationTableHeader has-i18n">
                      <span
                        class="currency-title has-i18n"
                        data-i18n="controller:account.Currencydenomination">
                        Currency Denomination
                      </span>
                      <i
                        class="fas fa-cash-register fa-2x"
                        id="openCashDrawerOnCloseShiftbuttonid"
                        aria-hidden="true">
                      </i>
                    </th>
                  </tr>
                </thead>
                <tbody>
                </tbody>
                <tfoot class="currencyDenominationTableFooter">
                  <tr>
                    <td
                      colspan="2"
                      class="has-i18n"
                      data-i18n="controller:account.Totalcashindrawer">
                      Cash In Drawer :
                    </td>
                    <td class="total-cell">
                      <input
                        type="number"
                        step="any"
                        id="closeShiftCashInDrawerId" />
                    </td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </div>
          <div class="col-6 acc-layout-col">
            <div class="acc-card acc-card-main">
              <div class="acc-card-header">
                <span
                  class="has-i18n"
                  data-i18n="controller:account.Paymentreconciliation">
                  Payment Reconciliation
                </span>
              </div>
              <div class="closeShiftTransactionTableContainerClass acc-scroll">
                <table id="closeShiftTransactionsTableId">
                  <thead>
                    <tr class="closeShiftTransactionTableHeader">
                      <th
                        class="has-i18n"
                        data-i18n="controller:account.Paymentmode">
                        Mode
                      </th>
                      <th
                        class="closeShiftTransactionCount has-i18n"
                        data-i18n="controller:account.Transactioncount">
                        Count
                      </th>
                      <th
                        class="closeShiftSettledAmount has-i18n"
                        data-i18n="controller:account.Settled">
                        Settled
                      </th>
                      <th
                        class="closeShiftActualAmount has-i18n"
                        data-i18n="controller:account.Actual">
                        Actual
                      </th>
                      <th
                        class="closeShiftVarianceAmount has-i18n"
                        data-i18n="controller:account.Variance">
                        Variance
                      </th>
                    </tr>
                  </thead>
                  <tbody>
                    <!-- Rows will be generated dynamically with JS -->
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Session Info + Account Statistics row (like Close Day & Shift) -->
            <div class="acc-row-two">
              <!-- Session Info -->
              <div class="acc-card acc-card-half">
                <div
                  class="acc-card-subtitle has-i18n"
                  data-i18n="controller:account.Sessioninfo">
                  Session Info
                </div>
                <div class="modal-info-row revenueDetails">
                  <label class="info-field">
                    <span class="info-key" id="closeShiftRevenueId_key"></span>
                    <span class="info-value"
                      id="closeShiftRevenueId_value"></span>
                  </label>
                  <label class="info-field">
                    <span class="info-key" id="closeShiftUsernameId_key"></span>
                    <span class="info-value"
                      id="closeShiftUsernameId_value"></span>
                  </label>

                  <!-- ✅ FIXED: Removed INPUT field, kept only SPAN for display -->
                  <label class="info-field">
                    <span class="info-key" id="closeShiftCashDrawerId_key">Cash
                      drawer ID :</span>
                    <span class="info-value"
                      id="closeShiftCashdrawerId"></span>
                  </label>

                </div>
              </div>

              <!-- Account Statistics -->
              <div class="acc-card acc-card-half">
                <div
                  class="acc-card-subtitle has-i18n"
                  data-i18n="controller:account.Accountstatistics">
                  Account Statistics
                </div>
                <div class="modal-info-row">
                  <label class="info-field">
                    <span class="info-key"
                      id="closeShiftOpeningBalanceId_key"></span>
                    <span class="info-value"
                      id="closeShiftOpeningBalanceId_value"></span>
                  </label>
                  <label class="info-field">
                    <span class="info-key"
                      id="closeShiftExpenseTotalId_key"></span>
                    <span class="info-value"
                      id="closeShiftExpenseTotalId_value"></span>
                  </label>
                </div>
              </div>
            </div>

            <!-- Shift Notes -->
            <div class="acc-card acc-card-notes">
              <div
                class="acc-card-subtitle has-i18n"
                data-i18n="controller:account.Shiftnotes">
                Closing Shift Notes
              </div>
              <input
                placeholder="Comments Here"
                id="closeShiftCommentInputId"
                class="closeShiftCommentInput has-i18n"
                data-i18n="[placeholder]controller:account.Commentshere" />
            </div>
          </div>

          <!-- ================= RIGHT COLUMN : ORDER STATS + BUTTONS ================= -->
          <div class="col-3 accountStatistics acc-layout-col">
            <div class="acc-card acc-card-full">

              <!-- Order statistics -->
              <div
                class="acc-card-subtitle has-i18n"
                data-i18n="controller:account.Orderstatistics">
                Order Statistics (Shift)
              </div>
              <div class="modal-info-row prevDayCloseDayShiftSummary">
                <label class="info-field">
                  <span
                    class="info-key"
                    id="closeShiftFulfilledOrdersCountId_key"></span>
                  <span
                    class="info-value"
                    id="closeShiftFulfilledOrdersCountId_value"></span>
                </label>
                <label class="info-field">
                  <span
                    class="info-key"
                    id="closeShiftCancelledOrdersCountId_key"></span>
                  <span
                    class="info-value"
                    id="closeShiftCancelledOrdersCountId_value"></span>
                </label>
                <label class="info-field">
                  <span
                    class="info-key"
                    id="closeShiftComplementaryOrdersCountId_key"></span>
                  <span
                    class="info-value"
                    id="closeShiftComplementaryOrdersCountId_value"></span>
                </label>
              </div>

              <!-- Buttons -->
              <div class="acc-summary-actions closeShiftButtonsContainer">
                <button
                  class="btn btn-danger closeDayAndShiftModalButton has-i18n"
                  data-dismiss="modal"
                  data-i18n="controller:account.Close">
                  Close
                </button>
                <input
                  type="button"
                  value="CLOSE SHIFT"
                  id="CloseShiftButtonId"
                  class="has-i18n"
                  data-i18n="[value]controller:account.Closeshift" />
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<script>
require('../js/Account/CloseShift.js');
</script>
