<div class="getintouch-div" style="display: grid">
  <label data-i18n="login.getInTouchWithUs" class="has-i18n" for=""
    >Get in touch with us</label
  >
  <input
    data-i18n="[placeholder]login.Mobile"
    class="has-i18n"
    type="text"
    name=""
    id="gint-customer-mobile-id"
    placeholder="Mobile *"
  />
  <input
    data-i18n="[placeholder]login.Email"
    class="has-i18n"
    type="text"
    name=""
    id="gint-customer-email-id"
    placeholder="Email"
  />
  <select
    class="full-width"
    name=""
    id="gint-queryselect-id"
    style="margin-top: 8px; font-size: 13px; height: 35px"
  >
    <option
      data-i18n="login.enquiryForTitle"
      class="has-i18n"
      disabled
      selected
      value
    >
      Enquiry for
    </option>
    <option
      data-i18n="login.enquiryFor.newFeatures"
      class="has-i18n"
      value="New Features"
    >
      New Features
    </option>
    <option
      data-i18n="login.enquiryFor.Training"
      class="has-i18n"
      value="Training"
    >
      Training
    </option>
    <option
      data-i18n="login.enquiryFor.printerConfiguration"
      class="has-i18n"
      value="Printer configuration"
    >
      Printer configuration
    </option>
    <option
      data-i18n="login.enquiryFor.onlineIntegrationSupport"
      class="has-i18n"
      value="Online Integration support"
    >
      Online Integration support
    </option>
    <option
      data-i18n="login.enquiryFor.POSInstalltionOnNewSystem"
      class="has-i18n"
      value="POS Installation on New System"
    >
      POS Installation on New System
    </option>
    <option
      data-i18n="login.enquiryFor.newAddonProductPurchase"
      class="has-i18n"
      value="New Addon-Product Purchase"
    >
      New Addon-Product Purchase
    </option>
    <option
      data-i18n="login.enquiryFor.inventoryTraining"
      class="has-i18n"
      value="Inventory Training"
    >
      Inventory Training
    </option>
    <option
      data-i18n="login.enquiryFor.dataSyncing"
      class="has-i18n"
      value="Data Syncing"
    >
      Data Syncing
    </option>
  </select>
  <input
    data-i18n="[placeholder]login.Date"
    class="has-i18n"
    type="text"
    name=""
    id="gint-date-id"
    placeholder="Date"
  />
</div>
<style>
  .daterangepicker .option.disabled {
    pointer-events: none;
    opacity: 0.4;
    text-decoration: none;
    cursor: not-allowed;
  }
  #gint-date-id {
    text-decoration: none;
  }
  .daterangepicker option.disabled,
  .daterangepicker .option.disabled,
  .daterangepicker td.disabled {
    text-decoration: none !important;
  }

  #gint-daterange-option-disabled,
  #gint-daterange-td-disabled {
    text-decoration: none !important;
  }
</style>
