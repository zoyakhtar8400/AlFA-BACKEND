<link rel="stylesheet" href="../css/CustomerManagement.css">

<div class="customer-mgmt-container">
  <div class="actions-div">
    <input
      data-i18n="[placeholder]masterScreen.customerManagement.Search"
      class="has-i18n"
      type="text"
      id="searchCustomermgmtid"
      placeholder="Search"
      style="margin: 0 !important;" />

    <input
      id="hiddenFileimport"
      accept=".xlsx"
      type="file"
      style="position:absolute; opacity:0; width:1px; height:1px;" />
    <button
      data-i18n="masterScreen.customerManagement.AddHeading"
      id="openaddcustomerModal"
      class="normal-button has-i18n">
      <i class="fas fa-plus"></i>Add
    </button>
    <button
      data-i18n="masterScreen.customerManagement.Refresh"
      id="refreshcustomermgmtButton"
      class="normal-button has-i18n">
      <i class="fas fa-sync-alt"></i>Refresh
    </button>
    <button
      data-i18n="masterScreen.customerManagement.Import"
      id="importCustomersbutton"
      class="normal-button has-i18n">
      <i class="fas fa-file-import"></i>Import
    </button>
    <button
      data-i18n="masterScreen.customerManagement.Import"
      id="exportCustomersbutton"
      class="normal-button has-i18n">
      <i class="fas fa-file-export"></i>Export
    </button>
  </div>
  <div class="customer-data-div">
    <table
      class="table table-sm table-striped customermgmtDattableclass"
      id="customermgmtDattable"></table>
  </div>
</div>

<!-- Custmor history analysis window -->
<div class="modal fade" id="addCusomermodalid">
  <div class="modal-dialog modal-dialog-centered addCusomermodal-dialog">
    <div class="modal-content addCusomermodalWrapper">
      <!-- Modal Header -->
      <div class="modal-header">
        <h4
          data-i18n="masterScreen.customerManagement.Add.customerForm"
          class="modal-title has-i18n">
          Customer Form
        </h4>
        <button type="button" class="close" data-dismiss="modal">
          &times;
        </button>
      </div>
      <!-- Modal body -->
      <div class="modal-body addCusomermodalbody" id="addCusomermodalBodyid">
        <div class="input-container">
          <label
            data-i18n="masterScreen.customerManagement.Add.Salutation"
            class="titleLabel has-i18n"
            for="mgmt_customerSalutationId">
            Salutation:
          </label>

          <select class id="mgmt_customerSalutationId">
            <option
              data-i18n="masterScreen.customerManagement.Add.SelectSalutation"
              value="-1"
              class="has-i18n"
              disabled
              selected>
              -- Select Salutation --
            </option>
          </select>
        </div>
        <div class="input-container">
          <label
            data-i18n="masterScreen.customerManagement.Add.Name"
            class="titleLabel has-i18n"
            for="mgmt_customernameId">Name:</label>
          <input
            data-i18n="[placeholder]masterScreen.customerManagement.Add.Name"
            class="has-i18n"
            type="text"
            id="mgmt_customernameId"
            placeholder="Name *" />
        </div>
        <div class="input-container">
          <label data-i18n="masterScreen.customerManagement.Add.CountryCode"
            class="titleLabel has-i18n" for="mgmt_customerFormDialCodeId">
            Country code:
          </label>
          <select class id="mgmt_customerFormDialCodeId"></select>
        </div>
        <div class="input-container">
          <label
            data-i18n="masterScreen.customerManagement.Add.Mobile"
            class="titleLabel has-i18n"
            for="mgmt_customermobileid">Mobile:</label>
          <input
            data-i18n="[placeholder]masterScreen.customerManagement.Add.Mobile"
            class="has-i18n"
            type="text"
            id="mgmt_customermobileid"
            placeholder="Mobile *" />
        </div>
        <div class="input-container">
          <label

            for="mgmt_customerFormAlternateDialCodeId">
            Alternate Country code:
          </label>
          <select class id="mgmt_customerFormAlternateDialCodeId"></select>

        <div class="input-container">

          <input
            data-i18n="[placeholder]masterScreen.customerManagement.Add.AlternateMobile"

        <div class="input-container">

          <input

            class="has-i18n"
            type="text"

            id="mgmt_customerdescid"
            placeholder="Description" />
        </div>
        <div class="input-container">
          <label data-i18n="masterScreen.customerManagement.Add.UserType"
            class="titleLabel has-i18n" for="mgmt_customerUserTypeId">
            User Type:
          </label>
          <select class id="mgmt_customerUserTypeId">
            <option
              data-i18n
              value="-1"
              class="has-i18n"
              disabled
              selected
              value>
              -- Select User Type --
            </option>
          </select>
        </div>
        <div class="input-container">
          <label data-i18n="masterScreen.customerManagement.Add.Comment"
            class="titleLabel has-i18n" for="mgmt_customerCommentid">
            Comment:
          </label>
          <input
            data-i18n="[placeholder]masterScreen.customerManagement.Add.Comment"
            class="has-i18n"
            type="text"
            name
            id="mgmt_customerCommentid"
            placeholder="Comment" />

        </div>
        <div class="input-container">
          <label
            data-i18n="masterScreen.customerManagement.Add.CreatedDate"
            class="titleLabel has-i18n"
            for="mgmt_customercreatedDate">
            Created Date:
          </label>

          <input
            data-i18n="[placeholder]masterScreen.customerManagement.Add.CreatedDate"
            class="has-i18n"
            type="text"
            id="mgmt_customercreatedDate"

        </div>
        <div class="input-container">
          <input type="checkbox" name id="createcustomerWalletcheck2" />
          <label
            data-i18n="masterScreen.customerManagement.Add.createWallet"
            class="has-i18n"
            for="createcustomerWalletcheck2">Create wallet</label>
        </div>
      </div>
      <div class="modal-footer">
        <button
          data-i18n="masterScreen.customerManagement.AddHeading"
          id="addCustomermgmtbutton"
          type="button"
          class="btn btn-secondary has-i18n">
          Add
        </button>
        <button
          data-i18n="masterScreen.customerManagement.Add.Close"
          type="button"
          class="btn btn-secondary has-i18n"
          data-dismiss="modal">
          Close
        </button>
      </div>

<script>
  require('../js/CustomerManagement.js');
